name: Bucato
options:
  bundleIdPrefix: im.filippo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "1600"

settings:
  base:
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_MODULE_VERIFIER: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    # FoundationModels only exists from iOS 26. The app runs on iOS 17, so the
    # framework has to be weak-linked: on older systems the symbols resolve to
    # null and the guarded code is simply never reached.
    OTHER_LDFLAGS: -ObjC -weak_framework FoundationModels

targets:
  Bucato:
    type: application
    platform: iOS
    sources:
      - path: Bucato
    settings:
      base:
        PRODUCT_NAME: Bucato
        PRODUCT_BUNDLE_IDENTIFIER: im.filippo.bucato
        INFOPLIST_FILE: Bucato/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Bucato/Support/Bucato.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

schemes:
  Bucato:
    build:
      targets:
        Bucato: all
    run:
      config: Debug
    archive:
      config: Release
